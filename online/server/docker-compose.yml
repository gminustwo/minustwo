name: godzilla-shadnet
services:
  shadnet:
    build: .
    image: godzilla-shadnet:local
    restart: unless-stopped
    ports:
      - "31313:31313/tcp"
      - "31314:31314/udp"
      - "31315:31315/tcp"
    volumes:
      - shadnet-data:/data
  relay:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "-u", "/relay.py"]
    ports:
      - "31316:31316/udp"
    volumes:
      - ./relay.py:/relay.py:ro

volumes:
  shadnet-data:
